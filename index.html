<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { 
            background-color: #000000; 
            color: #f4f4f5; 
            font-family: 'Pretendard', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center min-h-screen items-center bg-zinc-950 p-0 sm:p-4">

    <!-- MOBILE PHONE FRAME -->
    <div class="w-full max-w-[410px] h-[840px] bg-black rounded-[40px] border-[8px] border-zinc-800 shadow-2xl relative overflow-hidden flex flex-col text-white">
        
        <!-- STATUS BAR -->
        <div class="bg-black text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs z-50 flex-shrink-0">
            <span class="font-semibold">12:30</span>
            <div class="w-20 h-4 bg-zinc-900 rounded-full mx-auto -mt-1 flex items-center justify-center">
                <div class="w-3 h-3 bg-zinc-800 rounded-full"></div>
            </div>
            <div class="flex items-center space-x-1.5 text-[10px]">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- APP CONTENT AREA -->
        <div class="flex-1 flex flex-col bg-black overflow-hidden relative">
            
            <!-- 🏠 VIEW 1: HOME FEED (홈 피드 - 스크롤 5개 포스트) -->
            <div id="viewHome" class="flex-1 overflow-y-auto no-scrollbar pb-16">
                <!-- IG Header -->
                <div class="px-4 py-2 flex justify-between items-center border-b border-zinc-900 sticky top-0 bg-black z-20">
                    <span class="text-xl font-bold tracking-tight italic font-serif">Instagram</span>
                    <div class="flex space-x-5 text-xl">
                        <i class="fa-regular fa-heart cursor-pointer"></i>
                        <i class="fa-regular fa-paper-plane cursor-pointer" onclick="switchView('dm')"></i>
                    </div>
                </div>

                <!-- Stories Bar -->
                <div class="flex space-x-4 px-4 py-3 border-b border-zinc-900 overflow-x-auto no-scrollbar">
                    <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer">
                        <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-amber-500 to-rose-500">
                            <img src="photo1.jpg" class="w-full h-full object-cover rounded-full bg-zinc-800" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=jjoojj'">
                        </div>
                        <span class="text-[11px] text-zinc-300">스토리</span>
                    </div>
                    <div class="flex flex-col items-center space-y-1 flex-shrink-0">
                        <div class="w-16 h-16 rounded-full p-[2px] bg-zinc-800">
                            <img src="photo2.jpg" class="w-full h-full object-cover rounded-full bg-zinc-800" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=sion'">
                        </div>
                        <span class="text-[11px] text-zinc-400">sion._.9</span>
                    </div>
                    <div class="flex flex-col items-center space-y-1 flex-shrink-0">
                        <div class="w-16 h-16 rounded-full p-[2px] bg-zinc-800">
                            <img src="photo3.jpg" class="w-full h-full object-cover rounded-full bg-zinc-800" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=joo'">
                        </div>
                        <span class="text-[11px] text-zinc-400">joo_young0</span>
                    </div>
                </div>

                <!-- Posts List (5개 포스트) -->
                <div id="homePostsContainer" class="divide-y divide-zinc-900">
                    <!-- JS로 1~5번 포스트 렌더링 -->
                </div>
            </div>

            <!-- 👤 VIEW 2: MY PROFILE (여주 프로필 & 피드 12개 그리드) -->
            <div id="viewProfile" class="flex-1 overflow-y-auto no-scrollbar pb-16 hidden">
                <!-- Profile Header -->
                <div class="px-4 py-3 flex justify-between items-center border-b border-zinc-900 sticky top-0 bg-black z-20">
                    <span class="font-bold text-sm">jjoojj <i class="fa-solid fa-lock text-[10px] ml-1"></i></span>
                    <div class="flex space-x-5 text-xl">
                        <i class="fa-regular fa-square-plus cursor-pointer"></i>
                        <i class="fa-solid fa-bars cursor-pointer"></i>
                    </div>
                </div>

                <!-- Profile Info -->
                <div class="px-4 py-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="w-20 h-20 rounded-full bg-zinc-800 overflow-hidden border border-zinc-700">
                            <img src="photo1.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150/18181b/ffffff?text=jjoojj'">
                        </div>
                        <div class="flex space-x-6 text-center flex-1 justify-around ml-4">
                            <div>
                                <div class="font-bold text-base">102</div>
                                <div class="text-xs text-zinc-400">게시물</div>
                            </div>
                            <div>
                                <div class="font-bold text-base">12</div>
                                <div class="text-xs text-zinc-400">팔로워</div>
                            </div>
                            <div>
                                <div class="font-bold text-base">13</div>
                                <div class="text-xs text-zinc-400">팔로잉</div>
                            </div>
                        </div>
                    </div>
                    <div class="text-xs space-y-1">
                        <div class="font-bold">이여주</div>
                        <div class="text-zinc-300">🎨 회화과 26</div>
                        <div class="text-zinc-400">집에 보내주세요...</div>
                    </div>
                    <div class="flex space-x-2 mt-4">
                        <button class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-1.5 rounded-lg text-xs font-bold transition">프로필 편집</button>
                        <button class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-1.5 rounded-lg text-xs font-bold transition">보관함</button>
                    </div>
                </div>

                <!-- Feed Grid (12개 포스트 그리드) -->
                <div class="border-t border-zinc-900 grid grid-cols-3 gap-[1px] bg-zinc-900" id="profileGridContainer">
                    <!-- JS로 feed1 ~ feed12 렌더링 -->
                </div>
            </div>

            <!-- 💬 VIEW 3: DM CHAT ROOM (시온과의 디엠창) -->
            <div id="viewDM" class="flex-1 flex flex-col bg-black hidden">
                <div class="px-4 py-3 flex items-center justify-between border-b border-zinc-900 bg-black sticky top-0 z-20">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-full bg-zinc-800 overflow-hidden">
                                <img src="photo2.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=Sion'">
                            </div>
                            <div>
                                <div class="font-bold text-xs flex items-center">오시온 <i class="fa-solid fa-circle-check text-sky-500 text-[9px] ml-1"></i></div>
                                <div class="text-[10px] text-zinc-400">활동 중</div>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-5 text-lg text-zinc-300">
                        <i class="fa-solid fa-phone"></i>
                        <i class="fa-solid fa-video"></i>
                    </div>
                </div>

                <!-- DM Messages Body -->
                <div class="flex-1 p-4 space-y-3 overflow-y-auto text-xs">
                    <div class="text-center text-[10px] text-zinc-500 my-2">인스타그램 직접 메시지</div>
                    
                    <!-- 시온 메시지 -->
                    <div class="flex items-end space-x-2">
                        <div class="w-7 h-7 rounded-full bg-zinc-800 overflow-hidden flex-shrink-0">
                            <img src="photo2.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=S'>
                        </div>
                        <div class="bg-zinc-800 text-zinc-100 p-2.5 rounded-2xl max-w-[70%]">
                            과제 다 해가지고 공강임. 어디야?
                        </div>
                    </div>

                    <!-- 여주 답변 -->
                    <div class="flex items-end justify-end space-x-2">
                        <div class="bg-sky-600 text-white p-2.5 rounded-2xl max-w-[70%]">
                            실기실이지 당연히... 오지 마 사람 눈많아 ㅡㅡ
                        </div>
                    </div>

                    <!-- 시온 메시지 -->
                    <div class="flex items-end space-x-2">
                        <div class="w-7 h-7 rounded-full bg-zinc-800 overflow-hidden flex-shrink-0">
                            <img src="photo2.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=S'>
                        </div>
                        <div class="bg-zinc-800 text-zinc-100 p-2.5 rounded-2xl max-w-[70%]">
                            후문 앞에 초코라떼 사서 대기 중. 10분 내로 나와.
                        </div>
                    </div>
                </div>

                <!-- DM Input -->
                <div class="p-3 border-t border-zinc-900 bg-black flex items-center space-x-2">
                    <input type="text" placeholder="메시지 보내기..." class="flex-1 bg-zinc-900 text-xs px-4 py-2.5 rounded-full border border-zinc-800 focus:outline-none text-white">
                    <span class="text-sky-500 font-bold text-xs px-2 cursor-pointer">전송</span>
                </div>
            </div>

            <!-- APP BOTTOM NAVIGATION -->
            <nav class="bg-black border-t border-zinc-900 py-2.5 px-6 flex justify-between items-center text-xl text-zinc-300 flex-shrink-0 absolute bottom-0 w-full z-30">
                <i class="fa-solid fa-house cursor-pointer text-white" onclick="switchView('home')" id="navHome"></i>
                <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-white"></i>
                <i class="fa-regular fa-square-plus cursor-pointer hover:text-white"></i>
                <i class="fa-regular fa-paper-plane cursor-pointer hover:text-white" onclick="switchView('dm')" id="navDM"></i>
                <div class="w-6 h-6 rounded-full overflow-hidden border border-white cursor-pointer" onclick="switchView('profile')" id="navProfile">
                    <img src="photo1.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=Me'">
                </div>
            </nav>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 포스팅 1~5 데이터 (홈 피드용)
        const postsData = [
            { id: 1, img: "feed1.jpg", caption: "미대생의 지옥을 맛보는 중... 석고상 부수고 싶다 💀", likes: "좋아요 42개", comments: "댓글 5개 모두 보기", time: "2시간 전" },
            { id: 2, img: "feed2.jpg", caption: "학교 후문 앞 카페에서 아아 충전. 공강 최고다", likes: "좋아요 38개", comments: "댓글 2개 모두 보기", time: "5시간 전" },
            { id: 3, img: "feed3.jpg", caption: "과제물 들고 이동하다 비참해짐 우산도 없음", likes: "좋아요 51개", comments: "댓글 8개 모두 보기", time: "어제" },
            { id: 4, img: "feed4.jpg", caption: "주말에 그나마 숨통 트이는 중 ☕️", likes: "좋아요 64개", comments: "댓글 4개 모두 보기", time: "3일 전" },
            { id: 5, img: "feed5.jpg", caption: "봄은 언제 오냐... 작업실 창밖", likes: "좋아요 45개", comments: "댓글 3개 모두 보기", time: "4일 전" }
        ];

        // 뷰 전환 함수
        function switchView(viewName) {
            document.getElementById('viewHome').classList.add('hidden');
            document.getElementById('viewProfile').classList.add('hidden');
            document.getElementById('viewDM').classList.add('hidden');

            if (viewName === 'home') {
                document.getElementById('viewHome').classList.remove('hidden');
            } else if (viewName === 'profile') {
                document.getElementById('viewProfile').classList.remove('hidden');
            } else if (viewName === 'dm') {
                document.getElementById('viewDM').classList.remove('hidden');
            }
        }

        // 홈 피드 5개 렌더링
        function renderHomePosts() {
            const container = document.getElementById('homePostsContainer');
            container.innerHTML = postsData.map(post => `
                <article class="pb-3">
                    <!-- Post Header -->
                    <div class="flex items-center justify-between px-3 py-2.5">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-zinc-800 overflow-hidden">
                                <img src="photo1.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=Me'">
                            </div>
                            <span class="font-bold text-xs">jjoojj</span>
                        </div>
                        <i class="fa-solid fa-ellipsis text-zinc-400 text-xs"></i>
                    </div>
                    <!-- Post Image (정사각형) -->
                    <div class="w-full aspect-square bg-zinc-900 overflow-hidden flex items-center justify-center">
                        <img src="${post.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x600/18181b/ffffff?text=feed${post.id}.jpg'">
                    </div>
                    <!-- Post Actions -->
                    <div class="px-3 pt-2.5 pb-1 flex justify-between items-center text-lg">
                        <div class="flex space-x-4">
                            <i class="fa-regular fa-heart hover:text-rose-500 cursor-pointer"></i>
                            <i class="fa-regular fa-comment hover:text-zinc-400 cursor-pointer"></i>
                            <i class="fa-regular fa-paper-plane hover:text-zinc-400 cursor-pointer"></i>
                        </div>
                        <i class="fa-regular fa-bookmark hover:text-zinc-400 cursor-pointer"></i>
                    </div>
                    <!-- Post Details -->
                    <div class="px-3 text-xs space-y-1">
                        <div class="font-bold">${post.likes}</div>
                        <div><span class="font-bold mr-1.5">jjoojj</span><span class="text-zinc-200">${post.caption}</span></div>
                        <div class="text-zinc-500 cursor-pointer pt-0.5">${post.comments}</div>
                        <div class="text-[10px] text-zinc-500 uppercase">${post.time}</div>
                    </div>
                </article>
            `).join('');
        }

        // 프로필 그리드 12개 렌더링 (feed1 ~ feed12)
        function renderProfileGrid() {
            const container = document.getElementById('profileGridContainer');
            let html = '';
            for (let i = 1; i <= 12; i++) {
                // 1~5번은 피드 사진 연동, 6~12는 더미
                let imgName = i <= 5 ? `feed${i}.jpg` : `feed${i}.jpg`;
                html += `
                    <div class="aspect-square bg-zinc-900 overflow-hidden flex items-center justify-center cursor-pointer group relative">
                        <img src="${imgName}" class="w-full h-full object-cover group-hover:scale-105 transition" onerror="this.src='https://placehold.co/300x300/18181b/ffffff?text=feed${i}'">
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        window.onload = () => {
            renderHomePosts();
            renderProfileGrid();
        };
    </script>
</body>
</html>
