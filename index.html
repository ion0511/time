        let userLikesState = {};

        function unlockPhone() {
            const lock = document.getElementById('lockScreen');
            lock.classList.add('swipe-up');
            setTimeout(() => { lock.style.display = 'none'; }, 450);
        }

        function switchView(viewName) {
            document.getElementById('viewHome').classList.add('hidden');
            document.getElementById('viewProfile').classList.add('hidden');
            document.getElementById('viewDM').classList.add('hidden');

            if (viewName === 'home') document.getElementById('viewHome').classList.remove('hidden');
            else if (viewName === 'profile') document.getElementById('viewProfile').classList.remove('hidden');
            else if (viewName === 'dm') document.getElementById('viewDM').classList.remove('hidden');
        }

        // 하트 좋아요 클릭 (독자 참여)
        function toggleLike(postId) {
            const post = postsData.find(p => p.id === postId);
            if (!post) return;

            const icon = document.getElementById(`like-icon-${postId}`);
            const countEl = document.getElementById(`like-count-${postId}`);

            if (!userLikesState[postId]) {
                userLikesState[postId] = true;
                icon.className = "fa-solid fa-heart text-rose-500 cursor-pointer";
                post.likes += 1;
            } else {
                userLikesState[postId] = false;
                icon.className = "fa-regular fa-heart hover:text-rose-500 cursor-pointer";
                post.likes -= 1;
            }
            countEl.innerText = `좋아요 ${post.likes}개`;
        }

        // 댓글 더보기 토글
        function toggleComments(postId) {
            const el = document.getElementById(`comments-list-${postId}`);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        // 독자(lspy) 댓글 작성
        function addReaderComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const val = input.value.trim();
            if (!val) return;

            const post = postsData.find(p => p.id === postId);
            post.comments.push({ user: "lspy", text: val });

            input.value = '';
            renderHomePosts();

            // 펼쳐진 상태 유지
            const el = document.getElementById(`comments-list-${postId}`);
            if (el) el.classList.remove('hidden');
        }

        // 홈 피드 렌더링
        function renderHomePosts() {
            const container = document.getElementById('homePostsContainer');
            container.innerHTML = postsData.map(post => `
                <article class="pb-3">
                    <div class="flex items-center justify-between px-3 py-2.5">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-zinc-800 overflow-hidden">
                                <img src="${post.avatar}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/18181b/ffffff?text=${post.author}'">
                            </div>
                            <span class="font-bold text-xs">${post.author}</span>
                        </div>
                        <i class="fa-solid fa-ellipsis text-zinc-400 text-xs"></i>
                    </div>

                    <div class="w-full aspect-square bg-zinc-900 overflow-hidden flex items-center justify-center">
                        <img src="${post.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x600/18181b/ffffff?text=${post.img}'">
                    </div>

                    <div class="px-3 pt-2.5 pb-1 flex justify-between items-center text-lg">
                        <div class="flex space-x-4">
                            <i id="like-icon-${post.id}" onclick="toggleLike(${post.id})" class="${userLikesState[post.id] ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart hover:text-rose-500'} cursor-pointer"></i>
                            <i onclick="toggleComments(${post.id})" class="fa-regular fa-comment hover:text-zinc-400 cursor-pointer"></i>
                            <i class="fa-regular fa-paper-plane hover:text-zinc-400 cursor-pointer"></i>
                        </div>
                        <i class="fa-regular fa-bookmark hover:text-zinc-400 cursor-pointer"></i>
                    </div>

                    <div class="px-3 text-xs space-y-1">
                        <div class="font-bold text-zinc-200" id="like-count-${post.id}">좋아요 ${post.likes}개</div>
                        <div><span class="font-bold mr-1.5">${post.author}</span><span class="text-zinc-200">${post.caption}</span></div>
                        
                        <div onclick="toggleComments(${post.id})" class="text-zinc-500 cursor-pointer pt-0.5">
                            댓글 ${post.comments.length}개 모두 보기
                        </div>

                        <!-- 댓글 펼치기 영역 -->
                        <div id="comments-list-${post.id}" class="hidden space-y-1 pt-1 border-t border-zinc-900 mt-2">
                            ${post.comments.map(c => `
                                <div class="${c.isReply ? 'pl-3 border-l border-zinc-800' : ''} text-[11px]">
                                    <span class="font-bold ${c.user === 'lspy' ? 'text-sky-400' : 'text-zinc-300'} mr-1.5">${c.user}</span>
                                    <span class="text-zinc-300">${c.text}</span>
                                </div>
                            `).join('')}
                        </div>

                        <!-- 독자 댓글 입력창 -->
                        <div class="flex items-center space-x-2 pt-2">
                            <input type="text" id="comment-input-${post.id}" placeholder="lspy(으)로 댓글 달기..." class="flex-1 bg-transparent text-[11px] text-white focus:outline-none placeholder-zinc-600">
                            <button onclick="addReaderComment(${post.id})" class="text-sky-500 font-bold text-[11px]">게시</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        // 프로필 그리드 12개 렌더링
        function renderProfileGrid() {
            const container = document.getElementById('profileGridContainer');
            let html = '';
            for (let i = 1; i <= 12; i++) {
                html += `
                    <div class="aspect-square bg-zinc-900 overflow-hidden flex items-center justify-center cursor-pointer group">
                        <img src="feed${i}.jpg" class="w-full h-full object-cover group-hover:scale-105 transition" onerror="this.src='https://placehold.co/300x300/18181b/ffffff?text=feed${i}'">
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        window.onload = () => {
            renderHomePosts();
            renderProfileGrid();
        };
    </script>
</body>
</html>
